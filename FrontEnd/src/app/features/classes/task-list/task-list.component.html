<div class="row flex-grow-1" id="main-container">
<!-- Columna Izquierda (40% ancho) -->
<div class="col-4 background-white d-flex align-items-center justify-content-center position-relative">
    <!-- Actividades Pendientes -->
    <div 
      class="position-absolute" 
      style="top: 35px; left: 10%; right: 10%; height: 175px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; padding: 20px; border-radius: 15px; background: linear-gradient(135deg, #2c2c2c, #3b3b3b); color: white;">
      
      <!-- Título -->
      <h4 style="font-family: 'Poppins', sans-serif; font-weight: 700; margin-bottom: 10px; font-size: 16px;">Pendientes</h4>
      
      <!-- Mensaje -->
      <p style="font-family: 'Poppins', sans-serif; font-size: 14px; margin: 0; color: #d1d1d1;">
        ¡Felicidades! No tienes nada pendiente por ahora.
      </p>
    </div>
  </div>

  <!-- Columna Derecha (60% ancho) con Tareas en Columna -->
  <div class="col-8 background-white d-flex flex-column align-items-start justify-content-start position-relative" style="padding-top: 35px; gap: 15px; overflow-y: auto;">
    
    <!-- Tarea -->
    <div
    *ngFor="let task of tasks"
    class="task-box"
    (click)="toggleTask(task)"
    style="width: 90%; height: auto; display: flex; flex-direction: column; justify-content: space-between; padding: 0 20px; border-radius: 15px; background: linear-gradient(135deg, #2c2c2c, #3b3b3b); color: white; cursor: pointer; overflow: hidden;"
  >
    <!-- Encabezado de la tarea -->
    <div
      class="task-header"
      style="display: flex; align-items: center; justify-content: space-between; padding: 15px; height: 80px;"
    >
      <!-- Icono -->
      <div class="icon-container">
        <svg
          [style.color]="task.iconColor"
          width="40"
          height="40"
          viewBox="0 0 24 24"
          fill="currentColor"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="m16,2.172v-1.172c0-.553-.448-1-1-1s-1,.447-1,1v1h-2v-1c0-.553-.448-1-1-1s-1,.447-1,1v1h-2v-1c0-.553-.448-1-1-1s-1,.447-1,1v1h-2v-1c0-.553-.448-1-1-1s-1,.447-1,1v1.172c-1.164.413-2,1.524-2,2.828v14c0,2.757,2.243,5,5,5h8c2.757,0,5-2.243,5-5V5c0-1.304-.836-2.415-2-2.828Zm-6,14.828h-5c-.552,0-1-.447-1-1s.448-1,1-1h5c.552,0,1,.447,1,1s-.448,1-1,1Zm3-4H5c-.552,0-1-.447-1-1s.448-1,1-1h8c.552,0,1,.447,1,1s-.448,1-1,1Zm0-4H5c-.552,0-1-.447-1-1s.448-1,1-1h8c.552,0,1,.447,1,1s-.448,1-1,1Zm9,15l-1.121-1.121c-.563-.563-.879-1.326-.879-2.121V2c0-1.105.895-2,2-2h0c1.105,0,2,.895,2,2v18.757c0,.796-.316,1.559-.879,2.121l-1.121,1.121"
          />
        </svg>
      </div>
      <!-- Texto -->
      <div
        class="task-text placeholder-glow"
        style="flex-grow: 1; text-align: left; padding-left: 3%; font-size: 14px; opacity: 0.7; font-weight: 300;"
      >
        <span>{{ task.title }}</span>
      </div>
      <!-- Fecha límite -->
      <div class="task-date placeholder-glow" style="font-size: 12px; opacity: 0.7;">
        <span>Fecha límite: {{ task.deadline }}</span>
      </div>
      <!-- Menú de opciones -->
      <div class="options-menu placeholder-glow" style="display: flex; align-items: center;">
        <i class="fas" [ngClass]="{ 'fa-ellipsis-v': !task.isExpanded, 'fa-chevron-up': task.isExpanded }"></i>
      </div>
    </div>
  
    <!-- Contenido oculto: Se muestra solo si `isExpanded` es true -->
    <div
      class="task-content placeholder-glow"
      [@expandCollapse]="task.isExpanded ? 'expanded' : 'collapsed'"
      style="border-top: 1px solid rgba(255, 255, 255, 0.2); overflow: hidden;"
    >
      <p style="font-size: 14px; opacity: 0.7; padding: 10px; font-weight: 300;">
        <span>{{ task.description }}</span>
      </p>
      <div
        class="placeholder-glow"
        style="padding-bottom: 15px; padding-top: 15px; border-top: 1px solid rgba(255, 255, 255, 0.2);"
      >
        <p style="text-decoration: none; color: #0071BC; font-weight: 600; font-size: 14px; padding-left: 10px;" (click)="goToClassSelect(task.id_task)">Ver instrucciones</p>
      </div>
    </div>
  </div>
  </div>
</div>
