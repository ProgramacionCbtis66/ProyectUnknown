<div class="container my-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Clases</h2>
  </div>

  <div class="classes-grid">
    <div
      class="class-card"
      *ngFor="let clase of clases"
      (click)="goToClassSelect(clase.id_clase)"
    >
      <div class="card-content">
        <div class="card-header">
          <h3>{{ clase.nombre_clase }}</h3>
          <p class="professor">
            <i class="bx bxs-user"></i>
            {{ clase.profesor_nombre }}
          </p>
        </div>

<div class="tasks-section">
  <h4>Tareas</h4>
  <div *ngIf="clase.tareas_pendientes > 0; else noTareas">
    <p class="tasks-count">
      Tienes <strong>{{ clase.tareas_pendientes }}</strong> tarea(s) pendiente(s) en esta clase.
    </p>
  </div>
  <ng-template #noTareas>
    <p class="no-tasks">No hay tareas pendientes en esta clase.</p>
  </ng-template>
</div>
      </div>
    </div>
  </div>
</div>
