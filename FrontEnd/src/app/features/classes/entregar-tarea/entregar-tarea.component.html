<div class="container">
  <h2>Subir Archivo</h2>
  <div class="upload-box border rounded p-4 text-center"
       [class.drag-over]="isDragging"
       (dragover)="onDragOver($event)"
       (dragleave)="onDragLeave($event)"
       (drop)="onFileDrop($event)">
    <input type="file" id="fileInput" class="d-none" (change)="onFileSelect($event)" accept=".pdf" />
    <label for="fileInput" class="upload-label d-block">
      <div *ngIf="!archivoSeleccionado" class="upload-placeholder">
        <i class="bi bi-upload"></i>
        <p>Arrastra y suelta el archivo aquí o <span class="text-primary">elige un archivo</span></p>
        <small>Formatos permitidos: PDF | Tamaño máximo: 25MB</small>
      </div>
      <div *ngIf="archivoSeleccionado" class="upload-progress text-left">
        <div class="d-flex justify-content-between align-items-center">
          <span>{{ archivoSeleccionado.name }}</span>
          <button type="button" class="btn btn-sm btn-outline-danger delete-btn" (click)="eliminarArchivo()">&times;</button>
        </div>
        <div class="progress mt-2">
          <div class="progress-bar" role="progressbar" [style.width.%]="progreso" aria-valuemin="0" aria-valuemax="100"></div>
        </div>
        <div *ngIf="progreso === 100" class="upload-success mt-2">
          <i class="bi bi-check-circle-fill text-success"></i> Archivo subido exitosamente.
        </div>
      </div>
    </label>
  </div>
  <div class="mt-3 d-flex justify-content-end">
    <button type="button" class="btn btn-secondary me-2" (click)="eliminarArchivo()">Cancelar</button>
    <button type="submit" class="btn btn-primary" 
        [disabled]="!archivoSeleccionado || progreso > 0 && progreso < 100" 
        (click)="onSubmit()">
  Subir
</button>
  </div>
</div>
